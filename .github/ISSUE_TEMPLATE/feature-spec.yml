name: Feature Spec
description: Structured feature specification for MistHelper-Go development
title: "[Spec]: "
labels: ["feature-spec"]
body:
  - type: textarea
    id: problem-goal
    attributes:
      label: Problem / Goal
      description: What problem does this feature solve? What is the desired outcome?
      placeholder: Describe the problem or goal clearly. Include who is affected and why this matters.
    validations:
      required: true

  - type: textarea
    id: interfaces-behavior
    attributes:
      label: Interfaces & Behavior
      description: How will users interact with this feature? What inputs, outputs, and behaviors are expected?
      placeholder: |
        Describe CLI flags, SSH menu options, Mist API endpoints, or JSON routes.
        Include expected input formats and output formats (CSV, SQLite, console).
    validations:
      required: true

  - type: textarea
    id: constraints-performance
    attributes:
      label: Constraints / Performance
      description: Any performance requirements, resource limits, or technical constraints?
      placeholder: |
        Examples: Must complete within 60 seconds for 1000 devices.
        Must work behind Zscaler proxy. Must not exceed 100MB memory.
    validations:
      required: false

  - type: textarea
    id: security-secrets
    attributes:
      label: Security & Secrets
      description: Does this feature handle sensitive data, credentials, or external access?
      placeholder: |
        List any API tokens, passwords, or PII involved.
        Describe how secrets should be loaded (e.g., .env, environment variables).
        Note any input validation or sanitization requirements.
    validations:
      required: true

  - type: textarea
    id: test-plan
    attributes:
      label: Test Plan
      description: |
        How should this feature be tested? Include unit, integration, and edge case tests.
        For table-driven tests, define test cases as scenarios:
        - "Given valid input X, function returns Y"
        - "Given invalid input, function returns wrapped error"
      placeholder: |
        Unit tests: TestFeatureHappyPath, TestFeatureEdgeCase
        Integration: test with live API (optional, behind build tag)
        Table-driven: cover valid inputs, invalid inputs, boundary conditions
    validations:
      required: true

  - type: textarea
    id: migration-compatibility
    attributes:
      label: Migration / Compatibility
      description: Does this feature affect existing data, configs, or workflows?
      placeholder: |
        Breaking changes, database migrations, config file changes,
        backward compatibility requirements.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - [ ] Given X, when Y, then Z
        - [ ] All unit tests pass
        - [ ] go vet passes clean
        - [ ] golangci-lint passes clean
        - [ ] No new gosec findings
        - [ ] Documentation updated
    validations:
      required: true

  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation Notes
      description: Any technical context, prior art, or suggested approaches?
      placeholder: |
        Relevant existing code, packages to use, patterns to follow.
        See AGENTS.md and .github/copilot-instructions.md for agent rules.
    validations:
      required: false

  - type: textarea
    id: operator-checks
    attributes:
      label: Operator Interface Checks
      description: |
        How to verify the feature through the interfaces that exist: the SSH menu
        (port 2200), the CSV and SQLite output, and the JSON routes (port 8055).
        The HTTP server has JSON routes only, with no graphical pages.
        Read AGENTS.md and .github/copilot-instructions.md for agent rules.
      placeholder: |
        1. SSH menu: menu option number and the prompts it shows,
           e.g., "ssh -p 2200 misthelper@127.0.0.1 -> option 26 -> output written"
        2. Unattended run: the flags "--menu 26 --format sqlite" exit 0
        3. CSV output: file name data/{endpoint}_{timestamp}.csv, expected columns
        4. SQLite output: table in data/mist_data.db, natural key from
           internal/output/strategies.go, expected row count for the fake response
        5. JSON routes (only if internal/web changes): GET / and GET /health
           return status 200 and the expected fields
        6. Input handling: end-of-file, an interrupt, and an invalid menu entry
           stop safely; a destructive operation needs the word CONFIRM
        7. Non-goals: checks not covered by this feature
    validations:
      required: false
