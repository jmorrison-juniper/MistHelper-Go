# Copilot Coding Agent -- Auto-Assign on Label
# When a person adds the 'copilot' label to an issue, the shared workflow in
# misthelper-devtools assigns the Copilot Coding Agent to implement it. The
# agent reads .github/copilot-instructions.md for project conventions, creates
# a branch, implements the solution, and opens a PR. A maintainer can also
# start this workflow by hand for one issue.
#
# Prerequisites:
#   - Copilot Business/Enterprise seat on the repository owner account
#   - Copilot Coding Agent policy enabled in org/account settings
#   - 'copilot' label exists in the repository
#
# If the Copilot seat is not yet configured, the workflow posts a comment instead
# of failing silently.

name: Copilot Auto-Assign

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: The number of the issue to assign to the Copilot Coding Agent
        required: true

permissions: {}

jobs:
  assign-copilot:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'copilot'
    permissions:
      issues: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-copilot-assign.yml@ca3659400847c35f5dac438c37fc5055c020910e # v0.2.0
    with:
      issue-number: ${{ github.event.issue.number || github.event.inputs.issue_number }}