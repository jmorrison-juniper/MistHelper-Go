# Copilot Label from Issue Checkbox
# When a new issue is created with the "Assign to Copilot Coding Agent" checkbox
# checked, the shared workflow in misthelper-devtools adds the 'copilot' label
# and assigns the Copilot Coding Agent in the same run. A label that
# GITHUB_TOKEN adds starts no labeled workflow, so copilot-auto-assign.yml
# cannot do the assignment for a checkbox issue.

name: Copilot Label from Checkbox

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  check-copilot-checkbox:
    permissions:
      issues: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-copilot-assign.yml@ca3659400847c35f5dac438c37fc5055c020910e # v0.2.0
    with:
      issue-number: ${{ github.event.issue.number }}
      require-checkbox: true
      add-copilot-label: true