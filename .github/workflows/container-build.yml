name: Build and Push Container

on:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'Containerfile'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (leave empty for auto YY.MM.DD.HH.MM)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # First job: Validate Go compilation
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Validate Go build
        run: |
          echo "Checking Go compilation..."
          go build ./...
          echo "Build check passed"

      - name: Run go vet
        run: |
          echo "Running static analysis..."
          go vet ./...
          echo "Vet check passed"

  # Second job: Run tests (only if validation passes)
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Run tests
        run: go test ./... -race -cover -v

  # Third job: Build and push container (only if tests pass). The shared
  # workflow in misthelper-devtools builds the image with Buildx, pushes it to
  # ghcr.io/<owner>/<repo>, and tags it with the version and latest. The
  # version is YY.MM.DD.HH.MM in UTC unless version_override is set.
  build-and-push:
    needs: [validate, test]
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@bf1ba8a29ee9bab27b721db6e613fd5cd83d82fa # v0.4.0
    with:
      file: ./Containerfile
      tags: |
        type=raw,value=latest
      version-tag: true
      version: ${{ github.event.inputs.version_override }}
