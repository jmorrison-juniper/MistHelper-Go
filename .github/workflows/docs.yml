name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify landing page, links, screenshots, and regression tests
        run: |
          node --version
          node docs/check.mjs
          node --test docs/check.test.mjs
