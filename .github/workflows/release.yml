name: Release Artifacts

# A v*.*.* tag builds the release image and creates the GitHub release. The
# shared workflow in misthelper-devtools builds the image for amd64 and arm64,
# pushes it to ghcr.io/<owner>/<repo>, and tags it with the version (the tag
# without the leading v) and latest.

on:
  push:
    tags: ['v*.*.*']

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  version:
    name: Read the version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Remove the v from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-container:
    needs: [version]
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@bf1ba8a29ee9bab27b721db6e613fd5cd83d82fa # v0.4.0
    with:
      file: ./Containerfile
      version: ${{ needs.version.outputs.version }}
      version-tag: true
      tags: |
        type=raw,value=latest

  release:
    needs: [build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true