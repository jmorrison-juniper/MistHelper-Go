name: Auto-merge

# The shared workflow in misthelper-devtools enables auto-merge for a pull
# request with the auto-merge label. A merge by GITHUB_TOKEN starts no push run
# on main, so the shared workflow then starts each main workflow with a
# workflow_dispatch call.
#
# A merged pull request stops reading its branch. A commit that reaches the
# branch after the merge has no pull request, and no reviewer and no gate reads
# it. The orphaned-push report writes one notice on the merged pull request of
# that branch.
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened, closed]
  # WHY this push trigger stays, although it starts one run for each push to a
  # feature branch: the shared orphan job reads that push and reports a commit
  # that arrived after its pull request merged. The repository deletes a branch
  # on merge and squashes every merge, so an orphaned commit is easy to make and
  # hard to see. One run for each push costs about one minute, and the schedule
  # below cannot replace it, because a schedule reads no push event.
  push:
    branches-ignore: [main]
  schedule:
    # The backstop. GitHub can suppress the closed event above, because
    # GITHUB_TOKEN performs the merge. This run repairs main even when no
    # merge event arrives.
    # WHY every six hours and not every hour: the hourly form starts about 720
    # runs each month, and GitHub bills a whole minute for each one. That can
    # spend more than a third of the monthly allowance on a backstop that finds
    # work only after a merge. Four runs a day still repair main on the same day.
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  auto-merge:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-auto-merge.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      main-workflows: 'ci.yml codeql.yml container-build.yml'
      report-orphaned-push: true